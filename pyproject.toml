[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chartgrab"
version = "0.1.0"
description = "Read bar-chart values from browser <canvas> elements and chart images (canvas pixels + axis labels -> numbers)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "Pillow>=9"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=7", "playwright>=1.40"]

[project.scripts]
chartgrab = "chartgrab.cli:main"

[tool.setuptools.packages.find]
include = ["chartgrab*"]

[tool.setuptools.package-data]
chartgrab = ["collector/*.js"]
